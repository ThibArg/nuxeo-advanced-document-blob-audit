# Server-side translations, appended to the platform "messages" bundle by deployment-fragment.xml.
# SuggestDirectoryEntries resolves vocabulary labels here, not in the Web UI JSON files, so a key
# missing from this bundle is rendered as the key itself.
# The eventId must also exist as a row of the eventTypes vocabulary, otherwise it never appears in
# the Web UI "Performed Actions" filter - that row is created at startup by
# BlobDiffInitComponent#registerAuditEventType, never by a <dataFile> contribution.
