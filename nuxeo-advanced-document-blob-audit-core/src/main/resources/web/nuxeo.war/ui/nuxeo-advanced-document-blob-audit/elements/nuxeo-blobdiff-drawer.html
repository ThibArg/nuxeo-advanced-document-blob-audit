<!--
  Drawer panel (DRAWER_PAGES, name="blobdiffs"). The listing needs the full width, so this panel
  only describes the feature and brings the main page to the front.
-->
<dom-module id="nuxeo-blobdiff-drawer">
  <template>
    <style include="nuxeo-styles">
      :host { display: block; padding: 16px; }
      h3 { margin-top: 0; }
      p { opacity: 0.8; }
    </style>
    <h3>[[i18n('label.blobaudit.page.title')]]</h3>
    <p>[[i18n('label.blobaudit.drawer.description')]]</p>
    <paper-button noink class="primary" on-tap="_open">[[i18n('label.blobaudit.drawer.open')]]</paper-button>
  </template>
  <script>
    Polymer({
      is: 'nuxeo-blobdiff-drawer',
      behaviors: [Nuxeo.I18nBehavior],
      properties: {
        user: Object,
        visible: { type: Boolean, value: false, observer: '_visibleChanged' }
      },
      _visibleChanged: function (visible) {
        if (visible) { this._open(); }
      },
      _open: function () { Nuxeo.BlobAudit.openPage(); }
    });
  </script>
</dom-module>
