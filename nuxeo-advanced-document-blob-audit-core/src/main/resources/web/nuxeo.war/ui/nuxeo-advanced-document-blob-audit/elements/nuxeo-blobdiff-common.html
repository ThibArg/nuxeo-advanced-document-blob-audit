<!-- Shared helpers and styles -->
<script>
  (function () {
    window.Nuxeo = window.Nuxeo || {};
    Nuxeo.BlobAudit = {
      /** searchName of the audit search. Drives the route, the drawer form and the layout folder. */
      SEARCH: 'blobdiffs',

      /** Group configured server side (org.nuxeo.web.ui.blobaudit.auditorsGroup). */
      auditorsGroup: function () {
        var config = Nuxeo.UI && Nuxeo.UI.config && Nuxeo.UI.config.blobaudit;
        return (config && config.auditorsGroup) || 'administrators';
      },

      /** Mirror of BlobDiffAccess#isAuditor. Cosmetic only: the server enforces it. */
      isAuditor: function (user) {
        if (!user) {
          return false;
        }
        if (user.isAdministrator) {
          return true;
        }
        var groups = (user.extendedGroups || []).map(function (g) { return g.name; });
        if (user.properties && Array.isArray(user.properties.groups)) {
          groups = groups.concat(user.properties.groups);
        }
        return groups.indexOf('administrators') >= 0 || groups.indexOf(this.auditorsGroup()) >= 0;
      },

      showDocumentTab: function (document, user) {
        if (!document || document.type === 'BlobDiff' || !this.isAuditor(user)) {
          return false;
        }
        var schemas = (document.schemas || []).map(function (s) { return s.name; });
        return schemas.indexOf('file') >= 0 || schemas.indexOf('files') >= 0;
      },

      /**
       * The <nuxeo-search-form> of the audit search, or null.
       *
       * It lives in nuxeo-app's shadow DOM, stamped into iron-pages#drawer-pages by the
       * DRAWER_PAGES slot, and nothing exposes it: nuxeo-app keeps it in a plain property
       * (searchForm) that it resolves with the very same attribute selector. Reaching it from a
       * results row or from a document tab therefore means crossing one shadow root by hand.
       * Kept in a single place rather than repeated at each call site.
       */
      searchForm: function () {
        var app = document.querySelector('nuxeo-app');
        var root = app && app.shadowRoot;
        return (root && root.querySelector("[search-name='" + this.SEARCH + "']")) || null;
      },

      /**
       * Shows the audit search, optionally seeding filters first.
       *
       * @param params optional map of named parameters, bdsearch: prefixed, e.g.
       *               { 'bdsearch:sourceId': uid }
       * @param replace drop every other filter, rather than add these to those already set: the
       *                form is stamped once and keeps its filters for the whole session
       */
      openSearch: function (params, replace) {
        var app = document.querySelector('nuxeo-app');
        if (!app) {
          return;
        }
        var form = this.searchForm();
        // The form is stamped at startup, but stay defensive: a missing form must still navigate.
        if (form && params && replace) {
          form.set('params', Object.assign({}, params));
        } else if (form && params) {
          Object.keys(params).forEach(function (key) {
            form.set('params.' + key, params[key]);
          });
        }
        app.navigateTo('search', this.SEARCH);
      },

      statusClass: function (status) {
        switch (status) {
          case 'ok': return 'ok';
          case 'error': return 'error';
          default: return 'skipped';
        }
      },

      /** Mime type without case nor parameters, as ExtractorDescriptor#normalizeMimeType. */
      normalizeMimeType: function (mimeType) {
        return (mimeType || '').split(';')[0].trim().toLowerCase();
      },

      /** Whether the two versions hold different formats (item 62). Both must be known. */
      formatChanged: function (oldMimeType, newMimeType) {
        return !!oldMimeType && !!newMimeType &&
          this.normalizeMimeType(oldMimeType) !== this.normalizeMimeType(newMimeType);
      },

      /**
       * Short names of the two formats: the file extensions when they differ, which is what the
       * user sees ("json", "xml"), the mime subtypes otherwise.
       */
      formatPair: function (oldMimeType, newMimeType, oldFilename, newFilename) {
        var extension = function (filename) {
          var dot = filename ? filename.lastIndexOf('.') : -1;
          return dot > 0 && dot < filename.length - 1 ? filename.substring(dot + 1).toLowerCase() : '';
        };
        var oldExtension = extension(oldFilename);
        var newExtension = extension(newFilename);
        if (oldExtension && newExtension && oldExtension !== newExtension) {
          return [oldExtension, newExtension];
        }
        var subtype = function (mimeType) {
          var normalized = this.normalizeMimeType(mimeType);
          return normalized.substring(normalized.indexOf('/') + 1);
        }.bind(this);
        return [subtype(oldMimeType), subtype(newMimeType)];
      },

      // "retrying" too: a replay lost with a restarted node must be requestable again. The server
      // refuses a second one while the first is still queued or running.
      isRetryable: function (status) {
        return status === 'error' || status === 'retrying';
      },

      /** "+ added", "- removed", "~ changed" and "# section" lines of the unified diff. */
      lineClass: function (line) {
        if (!line) { return 'same'; }
        if (line.indexOf('# ') === 0) { return 'section'; }
        if (line.indexOf('+ ') === 0) { return 'add'; }
        if (line.indexOf('- ') === 0) { return 'remove'; }
        if (line.indexOf('~ ') === 0) { return 'change'; }
        return 'same';
      }
    };
  })();
</script>

<dom-module id="nuxeo-blobdiff-styles">
  <template>
    <style>
      .blobdiff-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 0.8em;
        font-weight: 500;
        color: #fff;
        background: #888;
        white-space: nowrap;
      }
      .blobdiff-badge.ok { background: #2e7d32; }
      .blobdiff-badge.error { background: #c62828; }
      .blobdiff-badge.skipped { background: #ef6c00; }
      .blobdiff-badge.info { background: #546e7a; }
      .blobdiff-counters { font-size: 0.85em; white-space: nowrap; }
      .blobdiff-counters .add { color: #2e7d32; }
      .blobdiff-counters .remove { color: #c62828; }
      .blobdiff-counters .change { color: #ef6c00; }
      .blobdiff-warning {
        display: flex;
        align-items: flex-start;
        padding: 12px;
        margin: 8px 0 16px;
        border-left: 4px solid #c62828;
        background: rgba(198, 40, 40, 0.08);
      }
      .blobdiff-warning iron-icon { color: #c62828; margin-right: 8px; flex: none; }
      .blobdiff-muted { opacity: 0.7; font-style: italic; }
    </style>
  </template>
</dom-module>
