<!-- Shared helpers and styles -->
<script>
  (function () {
    window.Nuxeo = window.Nuxeo || {};
    Nuxeo.BlobAudit = {
      PAGE: 'blobdiffs',

      /** Group configured server side (org.nuxeo.web.ui.blobaudit.auditorsGroup). */
      auditorsGroup: function () {
        var config = Nuxeo.UI && Nuxeo.UI.config && Nuxeo.UI.config.blobaudit;
        return (config && config.auditorsGroup) || 'administrators';
      },

      /** Mirror of BlobDiffAccess#isAuditor. Cosmetic only: the server enforces it. */
      isAuditor: function (user) {
        if (!user) {
          return false;
        }
        if (user.isAdministrator) {
          return true;
        }
        var groups = (user.extendedGroups || []).map(function (g) { return g.name; });
        if (user.properties && Array.isArray(user.properties.groups)) {
          groups = groups.concat(user.properties.groups);
        }
        return groups.indexOf('administrators') >= 0 || groups.indexOf(this.auditorsGroup()) >= 0;
      },

      showDocumentTab: function (document, user) {
        if (!document || document.type === 'BlobDiff' || !this.isAuditor(user)) {
          return false;
        }
        var schemas = (document.schemas || []).map(function (s) { return s.name; });
        return schemas.indexOf('file') >= 0 || schemas.indexOf('files') >= 0;
      },

      /** Shows the listing page in the main area. */
      openPage: function () {
        var app = document.querySelector('nuxeo-app');
        if (app) {
          app.page = this.PAGE;
        }
      },

      statusClass: function (status) {
        switch (status) {
          case 'ok': return 'ok';
          case 'error': return 'error';
          default: return 'skipped';
        }
      },

      /** "+ added", "- removed", "~ changed" and "# section" lines of the unified diff. */
      lineClass: function (line) {
        if (!line) { return 'same'; }
        if (line.indexOf('# ') === 0) { return 'section'; }
        if (line.indexOf('+ ') === 0) { return 'add'; }
        if (line.indexOf('- ') === 0) { return 'remove'; }
        if (line.indexOf('~ ') === 0) { return 'change'; }
        return 'same';
      }
    };
  })();
</script>

<dom-module id="nuxeo-blobdiff-styles">
  <template>
    <style>
      .blobdiff-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 0.8em;
        font-weight: 500;
        color: #fff;
        background: #888;
        white-space: nowrap;
      }
      .blobdiff-badge.ok { background: #2e7d32; }
      .blobdiff-badge.error { background: #c62828; }
      .blobdiff-badge.skipped { background: #ef6c00; }
      .blobdiff-badge.info { background: #546e7a; }
      .blobdiff-counters { font-size: 0.85em; white-space: nowrap; }
      .blobdiff-counters .add { color: #2e7d32; }
      .blobdiff-counters .remove { color: #c62828; }
      .blobdiff-counters .change { color: #ef6c00; }
      .blobdiff-warning {
        display: flex;
        align-items: flex-start;
        padding: 12px;
        margin: 8px 0 16px;
        border-left: 4px solid #c62828;
        background: rgba(198, 40, 40, 0.08);
      }
      .blobdiff-warning iron-icon { color: #c62828; margin-right: 8px; flex: none; }
      .blobdiff-muted { opacity: 0.7; font-style: italic; }
    </style>
  </template>
</dom-module>
