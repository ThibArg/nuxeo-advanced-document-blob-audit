<!--
  Main page (PAGES slot, name="blobdiffs"): filters, faceted listing of every BlobDiff, selection
  deletion, retention purge. Backed by the BLOB_DIFFS_ADMIN Elasticsearch page provider.
-->
<dom-module id="nuxeo-blobdiff-search-page">
  <template>
    <style include="nuxeo-blobdiff-styles nuxeo-styles iron-flex">
      :host { display: block; }
      .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; }
      .header h1 { margin: 0; font-size: 1.3em; }
      .body { display: flex; align-items: flex-start; }
      .filters {
        width: 280px;
        flex: none;
        padding: 0 16px 16px;
        box-sizing: border-box;
      }
      .filters > * { display: block; margin-bottom: 12px; }
      .results { flex: 1; min-width: 0; padding-right: 16px; }
      .selection { display: flex; align-items: center; gap: 8px; padding: 4px 0; min-height: 40px; }
      nuxeo-data-table { height: calc(100vh - 190px); }
      .cell-actions { display: flex; }
      .denied { padding: 32px; }
    </style>

    <nuxeo-page-provider id="provider"
                         provider="BLOB_DIFFS_ADMIN"
                         page-size="40"
                         enrichers="blobDiffSource"
                         schemas="dublincore,blobdiff"
                         params="[[_params]]"
                         aggregations="{{aggregations}}">
    </nuxeo-page-provider>
    <nuxeo-operation id="retryOp" op="BlobDiff.Retry"></nuxeo-operation>

    <template is="dom-if" if="[[!_isAuditor(user)]]">
      <div class="denied">[[i18n('label.blobaudit.denied')]]</div>
    </template>

    <template is="dom-if" if="[[_isAuditor(user)]]" restamp>
      <div class="header">
        <h1>[[i18n('label.blobaudit.page.title')]]</h1>
        <div>
          <paper-button noink on-tap="_reset">[[i18n('label.blobaudit.filters.reset')]]</paper-button>
          <paper-button noink class="secondary" on-tap="_openPurge">
            <iron-icon icon="icons:delete-sweep"></iron-icon>&nbsp;[[i18n('label.blobaudit.purge.title')]]
          </paper-button>
        </div>
      </div>

      <div class="body">
        <div class="filters">
          <nuxeo-date-picker label="[[i18n('label.blobaudit.filters.from')]]" value="{{dateMin}}"></nuxeo-date-picker>
          <nuxeo-date-picker label="[[i18n('label.blobaudit.filters.to')]]" value="{{dateMax}}"></nuxeo-date-picker>
          <nuxeo-document-suggestion label="[[i18n('label.blobaudit.filters.source')]]" value="{{sourceId}}"
                                     min-chars="1" placeholder="[[i18n('label.blobaudit.filters.sourcePlaceholder')]]">
          </nuxeo-document-suggestion>
          <nuxeo-user-suggestion label="[[i18n('label.blobaudit.filters.user')]]" value="{{userFilter}}"
                                 search-type="USER_TYPE"></nuxeo-user-suggestion>
          <paper-checkbox checked="{{truncatedOnly}}">[[i18n('label.blobaudit.filters.truncatedOnly')]]</paper-checkbox>
          <nuxeo-checkbox-aggregation label="[[i18n('label.blobaudit.diff.status')]]"
                                      data="[[aggregations.bdiff_status_agg]]" value="{{statusAgg}}">
          </nuxeo-checkbox-aggregation>
          <nuxeo-checkbox-aggregation label="[[i18n('label.blobaudit.filters.format')]]"
                                      data="[[aggregations.bdiff_mimetype_agg]]" value="{{mimetypeAgg}}">
          </nuxeo-checkbox-aggregation>
          <nuxeo-checkbox-aggregation label="[[i18n('label.blobaudit.diff.xpath')]]"
                                      data="[[aggregations.bdiff_xpath_agg]]" value="{{xpathAgg}}">
          </nuxeo-checkbox-aggregation>
          <nuxeo-checkbox-aggregation label="[[i18n('label.blobaudit.diff.user')]]"
                                      data="[[aggregations.bdiff_user_agg]]" value="{{userAgg}}">
          </nuxeo-checkbox-aggregation>
        </div>

        <div class="results">
          <div class="selection">
            <template is="dom-if" if="[[selectedItems.length]]">
              <span>[[i18n('label.blobaudit.selection', selectedItems.length)]]</span>
              <paper-button noink class="primary" on-tap="_deleteSelection">
                <iron-icon icon="icons:delete-forever"></iron-icon>&nbsp;[[i18n('label.blobaudit.delete.title')]]
              </paper-button>
            </template>
          </div>

          <nuxeo-data-table id="table" nx-provider="provider" selection-enabled
                            selected-items="{{selectedItems}}"
                            empty-label="[[i18n('label.blobaudit.empty')]]">
            <nuxeo-data-table-column name="[[i18n('label.blobaudit.diff.date')]]" sort-by="bdiff:date" flex="12">
              <template>
                <a href$="[[urlFor(item)]]">[[formatDateTime(item.properties.bdiff:date)]]</a>
              </template>
            </nuxeo-data-table-column>
            <nuxeo-data-table-column name="[[i18n('label.blobaudit.diff.user')]]" sort-by="bdiff:user" flex="10">
              <template><nuxeo-user-tag user="[[item.properties.bdiff:user]]"></nuxeo-user-tag></template>
            </nuxeo-data-table-column>
            <nuxeo-data-table-column name="[[i18n('label.blobaudit.diff.source')]]" flex="18">
              <template>
                <nuxeo-blobdiff-source-link source="[[item.contextParameters.blobDiffSource]]"
                                            source-id="[[item.properties.bdiff:sourceId]]">
                </nuxeo-blobdiff-source-link>
              </template>
            </nuxeo-data-table-column>
            <nuxeo-data-table-column name="[[i18n('label.blobaudit.diff.xpath')]]" sort-by="bdiff:xpath" flex="8">
              <template>[[item.properties.bdiff:xpath]]</template>
            </nuxeo-data-table-column>
            <nuxeo-data-table-column name="[[i18n('label.blobaudit.diff.file')]]" flex="12">
              <template><span title$="[[item.properties.bdiff:mimeType]]">[[item.properties.bdiff:newFilename]]</span></template>
            </nuxeo-data-table-column>
            <nuxeo-data-table-column name="[[i18n('label.blobaudit.diff.summary')]]" flex="18">
              <template>[[item.properties.bdiff:summary]]</template>
            </nuxeo-data-table-column>
            <nuxeo-data-table-column name="[[i18n('label.blobaudit.diff.status')]]" sort-by="bdiff:status" flex="12">
              <template><nuxeo-blobdiff-status document="[[item]]"></nuxeo-blobdiff-status></template>
            </nuxeo-data-table-column>
            <nuxeo-data-table-column name="" flex="10">
              <template>
                <div class="cell-actions">
                  <paper-icon-button icon="icons:filter-list" title$="[[i18n('label.blobaudit.action.filterSource')]]"
                                     on-tap="_filterOnSource"></paper-icon-button>
                  <template is="dom-if" if="[[item.properties.bdiff:diff.data]]">
                    <a href$="[[item.properties.bdiff:diff.data]]" download tabindex="-1">
                      <paper-icon-button icon="icons:file-download" title$="[[i18n('label.blobaudit.diff.download')]]">
                      </paper-icon-button>
                    </a>
                  </template>
                  <template is="dom-if" if="[[_canRetry(item)]]">
                    <paper-icon-button icon="icons:refresh" title$="[[i18n('label.blobaudit.action.retry')]]"
                                       on-tap="_retry"></paper-icon-button>
                  </template>
                </div>
              </template>
            </nuxeo-data-table-column>
          </nuxeo-data-table>
        </div>
      </div>
    </template>

    <nuxeo-blobdiff-delete-dialog id="deleteDialog"></nuxeo-blobdiff-delete-dialog>
    <nuxeo-blobdiff-purge-dialog id="purgeDialog"></nuxeo-blobdiff-purge-dialog>
  </template>
  <script>
    Polymer({
      is: 'nuxeo-blobdiff-search-page',
      behaviors: [Nuxeo.I18nBehavior, Nuxeo.FormatBehavior, Nuxeo.RoutingBehavior],
      properties: {
        user: Object,
        /** Set by the main iron-pages when this page is shown. */
        visible: { type: Boolean, value: false, observer: '_visibleChanged' },
        dateMin: String,
        dateMax: String,
        sourceId: String,
        userFilter: String,
        truncatedOnly: { type: Boolean, value: false },
        statusAgg: { type: Array, value: function () { return []; } },
        mimetypeAgg: { type: Array, value: function () { return []; } },
        xpathAgg: { type: Array, value: function () { return []; } },
        userAgg: { type: Array, value: function () { return []; } },
        aggregations: Object,
        selectedItems: { type: Array, value: function () { return []; } },
        _params: Object
      },
      observers: [
        '_filtersChanged(dateMin, dateMax, sourceId, userFilter, truncatedOnly, statusAgg.*, mimetypeAgg.*, xpathAgg.*, userAgg.*)'
      ],
      _isAuditor: function (user) { return Nuxeo.BlobAudit.isAuditor(user); },

      _filtersChanged: function () {
        var p = {};
        var put = function (key, value) {
          if (value === undefined || value === null || value === '' || (Array.isArray(value) && !value.length)) {
            return;
          }
          p[key] = value;
        };
        put('bdsearch:date_min', this.dateMin);
        put('bdsearch:date_max', this.dateMax);
        put('bdsearch:sourceId', this.sourceId);
        put('bdsearch:user', this.userFilter);
        put('bdsearch:truncated', this.truncatedOnly ? true : null);
        put('bdsearch:status_agg', this.statusAgg);
        put('bdsearch:mimetype_agg', this.mimetypeAgg);
        put('bdsearch:xpath_agg', this.xpathAgg);
        put('bdsearch:user_agg', this.userAgg);
        this._params = p;
        this._refresh();
      },

      _visibleChanged: function (visible) {
        if (visible) { this._refresh(); }
      },

      _refresh: function () {
        if (!this.visible || !this._isAuditor(this.user)) {
          return;
        }
        this.debounce('blobdiff-refresh', function () {
          var table = this.$$('#table');
          if (table) {
            table.fetch();
          }
        }.bind(this), 300);
      },

      _reset: function () {
        this.setProperties({
          dateMin: null, dateMax: null, sourceId: null, userFilter: null, truncatedOnly: false,
          statusAgg: [], mimetypeAgg: [], xpathAgg: [], userAgg: []
        });
      },

      _filterOnSource: function (e) {
        this.sourceId = e.model.item.properties['bdiff:sourceId'];
      },

      _canRetry: function (item) {
        var p = item && item.properties;
        return !!p && p['bdiff:status'] === 'error' && !!p['bdiff:oldBlobKey'] && !!p['bdiff:newBlobKey'];
      },

      _retry: function (e) {
        var item = e.model.item;
        this.$.retryOp.input = item.uid;
        this.$.retryOp.execute()
          .then(function () {
            this.fire('notify', { message: this.i18n('label.blobaudit.retry.done') });
            this.async(this._refresh, 1500);
          }.bind(this))
          .catch(function (err) {
            this.fire('notify', { message: this.i18n('label.blobaudit.retry.failed') + ' ' + (err && err.message || '') });
          }.bind(this));
      },

      _deleteSelection: function () {
        this.$.deleteDialog.open(this.selectedItems).then(function (deleted) {
          if (deleted) {
            var table = this.$$('#table');
            if (table && table.clearSelection) { table.clearSelection(); }
            this._refresh();
          }
        }.bind(this));
      },

      _openPurge: function () {
        this.$.purgeDialog.open().then(function (purged) {
          if (purged) { this._refresh(); }
        }.bind(this));
      }
    });
  </script>
</dom-module>
